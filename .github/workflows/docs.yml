name: documentation

on:
  pull_request:
    paths:
      - README.md
      - mkdocs.yml
      - docs/**
      - .github/workflows/docs.yml
  push:
    branches: [main]
    paths:
      - README.md
      - mkdocs.yml
      - docs/**
      - .github/workflows/docs.yml

jobs:
  mkdocs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install mkdocs==1.6.1
      - run: mkdocs build --strict
