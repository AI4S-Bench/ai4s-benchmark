name: repository-tests

on:
  pull_request:
    branches: [main]
    paths:
      - "bench/**"
      - "scripts/**"
      - "tests/**"
      - "tasks/**"
      - "pytest.ini"
      - ".github/workflows/tests.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "pytest==9.1.1"
      - run: pytest -q
